name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate NoSQL Workbench model
        run: node scripts/validate-workbench.mjs

      - name: Run simulator (invariants are assertions)
        working-directory: sim
        run: npm run sim:quick

      - name: CDK synth
        working-directory: cdk
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk synth --quiet
